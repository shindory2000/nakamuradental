<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LINE 経過のご連絡 QR（受付用）｜中村歯科医院</title>
<style>
  /* 受付に置く・会計で見せる QR。A4 に 2 枚（A5）並べて印刷。QR の行き先は LIFF（https://liff.line.me/<LIFF_ID>）。
     口コミの QR は載せない（院内で口コミを頼まない。口コミは登録後の画面と1週間後の LINE で任意に案内する）。 */
  :root{--ink:#16212e;--navy:#1f3f74;--soft:#5b6b7b;--line:#cfd9e4}
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f6;color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif}
  .bar{max-width:210mm;margin:16px auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px;font-size:14px;color:var(--soft)}
  .bar input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:260px}
  .bar button{font:inherit;font-weight:600;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
  .sheet{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;display:grid;grid-template-rows:1fr 1fr}
  .card{border-bottom:1px dashed var(--line);padding:16mm 18mm;display:flex;flex-direction:column;align-items:center;text-align:center}
  .card .brand{font-size:11pt;font-weight:600;letter-spacing:.06em;color:var(--navy);margin:0 0 6mm}
  .card h1{font-size:20pt;line-height:1.45;margin:0 0 4mm}
  .card p{font-size:11pt;line-height:1.75;margin:0 0 6mm;color:var(--soft)}
  .qr{width:56mm;height:56mm;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:4mm;padding:3mm}
  .qr img,.qr canvas{width:100%!important;height:100%!important}
  .qr .ph{font-size:10pt;color:#a33}
  .steps{display:flex;gap:6mm;margin:7mm 0 0;font-size:10pt;color:var(--ink)}
  .steps span b{color:var(--navy);font-weight:600;margin-right:1.5mm}
  .card .foot{margin-top:auto;font-size:9pt;color:var(--soft)}
  @media screen and (max-width:820px){.sheet{width:100%;min-height:0;grid-template-rows:auto}.card{padding:24px 16px}}
  @media print{@page{size:A4;margin:0}body{background:#fff}.bar{display:none}.sheet{margin:0}}
</style>
</head>
<body>
<div class="bar">
  <label>LIFF ID <input id="liff" placeholder="2000000000-abcdefgh"></label>
  <button onclick="print()">印刷する</button>
  <span>受付の台詞：「1週間後に治療後の具合を LINE でお伺いしています。よろしければこちらを読み取ってください」</span>
</div>
<div class="sheet" id="sheet"></div>
<template id="tpl">
  <div class="card">
    <div class="brand">中村歯科医院</div>
    <h1>治療後のご様子を<br>1週間後に LINE でおうかがいします</h1>
    <p>スマホのカメラで読み取ると LINE が開きます。<br>ボタンを押すだけでご回答いただけます。</p>
    <div class="qr"></div>
    <div class="steps"><span><b>1.</b>友だち追加</span><span><b>2.</b>フリガナを入力</span><span><b>3.</b>受け取るを押す</span></div>
    <div class="foot">ご不明な点は受付までお声がけください</div>
  </div>
</template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  var inp = document.getElementById('liff'), sheet = document.getElementById('sheet'), tpl = document.getElementById('tpl');
  var saved = ''; try { saved = localStorage.getItem('nd_liff_id') || ''; } catch (e) {}
  inp.value = new URLSearchParams(location.search).get('liff') || saved;
  function draw() {
    sheet.innerHTML = '';
    var id = inp.value.trim();
    try { localStorage.setItem('nd_liff_id', id); } catch (e) {}
    for (var i = 0; i < 2; i++) {
      var c = tpl.content.cloneNode(true), q = c.querySelector('.qr');
      sheet.appendChild(c);
      q = sheet.querySelectorAll('.qr')[i];
      if (!/^\d{6,}-\w+$/.test(id)) { q.innerHTML = '<span class="ph">LIFF ID を入れると<br>QR が出ます</span>'; continue; }
      new QRCode(q, { text: 'https://liff.line.me/' + id, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    }
  }
  inp.addEventListener('input', draw); draw();
</script>
</body>
</html>
