<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>口コミQRカード（印刷用）｜中村歯科医院</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 受付に置く口コミ依頼カード。A4 に同じカードを4枚（はがきサイズ）並べて印刷し、切って使う。
     QR の行き先は https://nakamuradental.jp/review.html（ページ側で Google の店舗ページへ案内）。 */
  :root{--ink:#16212e;--navy:#1f3f74;--soft:#5b6b7b;--line:#cfd9e4}
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f6;color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
  .bar{max-width:210mm;margin:16px auto;display:flex;gap:12px;align-items:center;padding:0 16px;font-size:14px;color:var(--soft)}
  .bar button{font:inherit;font-weight:700;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
  .sheet{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:148.5mm}
  .card{border:1px dashed var(--line);padding:12mm 10mm;display:flex;flex-direction:column;align-items:center;text-align:center}
  .card .en{font-size:9pt;letter-spacing:.28em;color:var(--navy);margin:0 0 3mm}
  .card h1{font-size:17pt;margin:0 0 4mm;line-height:1.35}
  .card p{font-size:9.5pt;line-height:1.7;margin:0 0 5mm;color:var(--soft)}
  .card img{width:46mm;height:46mm}
  .card .how{font-size:9pt;margin:5mm 0 0;color:var(--ink)}
  .card .name{margin-top:auto;font-size:10pt;font-weight:700;color:var(--navy)}
  @media screen and (max-width:820px){.sheet{width:100%;min-height:0;grid-template-columns:1fr;grid-auto-rows:auto}.card{min-height:120mm}}
  @media print{@page{size:A4;margin:0}body{background:#fff}.bar{display:none}.sheet{margin:0}}
</style>
</head>
<body>
<div class="bar"><button onclick="print()">印刷する</button><span>A4に4枚並びます。点線で切って受付に置いてください。</span></div>
<div class="sheet" id="sheet"></div>
<template id="tpl">
  <div class="card">
    <p class="en">THANK YOU</p>
    <h1>ご来院ありがとう<br>ございました</h1>
    <p>よろしければ、Googleの口コミで<br>ご感想をお聞かせください。</p>
    <img src="review-qr.svg" alt="口コミ投稿ページのQRコード">
    <p class="how">スマートフォンのカメラで読み取ってください</p>
    <div class="name">中村歯科医院</div>
  </div>
</template>
<script>
  var t=document.getElementById("tpl"),s=document.getElementById("sheet");
  for(var i=0;i<4;i++) s.appendChild(t.content.cloneNode(true));
</script>
</body>
</html>
